name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: ./scripts/check.sh
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
  binaries:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            os: linux
            arch: amd64
            ext: ''
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            ext: ''
          - runner: macos-15
            os: darwin
            arch: arm64
            ext: ''
          - runner: windows-2022
            os: windows
            arch: amd64
            ext: '.exe'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Ensure Windows C compiler
        if: runner.os == 'Windows'
        run: |
          if ! command -v gcc; then
            choco install mingw -y --no-progress
            echo 'C:\ProgramData\chocolatey\bin' >> "$GITHUB_PATH"
          fi
      - name: Native SQLite and CLI tests
        env:
          CGO_ENABLED: '1'
        run: |
          test "$(go env GOARCH)" = '${{ matrix.arch }}'
          go test -tags sqlite_omit_load_extension ./internal/storage/... ./cmd/lightd
      - name: Build stamped binary and notices
        env:
          CGO_ENABLED: '1'
          RELEASE_TAG: ${{ github.ref_name }}
          BINARY_NAME: lightd-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
        run: |
          mkdir -p package
          build_time=$(git show -s --format=%cI HEAD)
          go build -tags sqlite_omit_load_extension -trimpath -ldflags="-s -w -X github.com/dokzlo13/lightd/internal/buildinfo.Version=$RELEASE_TAG -X github.com/dokzlo13/lightd/internal/buildinfo.Commit=$GITHUB_SHA -X github.com/dokzlo13/lightd/internal/buildinfo.BuildTime=$build_time" -o "package/$BINARY_NAME" ./cmd/lightd
          "./package/$BINARY_NAME" --version
          "./package/$BINARY_NAME" --preview-policy examples/seasonal-policy.lua --date 2026-12-21 --timezone UTC --latitude 0 --longitude 0 --json
          python3 scripts/release-notices.py package/THIRD_PARTY
          cp -R docs examples package/
          cp README.md MANUAL.md CHANGELOG.md package/
      - name: Archive
        env:
          PACKAGE_NAME: lightd-${{ matrix.os }}-${{ matrix.arch }}
          PACKAGE_OS: ${{ matrix.os }}
        run: |
          python3 - <<'PY'
          import os,pathlib,tarfile,zipfile
          name=os.environ['PACKAGE_NAME'];root=pathlib.Path('package');pathlib.Path('release').mkdir(exist_ok=True)
          if os.environ['PACKAGE_OS']=='windows':
              with zipfile.ZipFile('release/'+name+'.zip','w',zipfile.ZIP_DEFLATED) as z:
                  for p in sorted(root.rglob('*')):
                      if p.is_file():z.write(p,p.relative_to(root))
          else:
              with tarfile.open('release/'+name+'.tar.gz','w:gz') as t:
                  for p in sorted(root.iterdir()):t.add(p,arcname=p.name)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.os }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
  image:
    needs: [quality, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build metadata
        id: meta
        run: |
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "built_at=$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and smoke-test container
        run: |
          docker build --build-arg VERSION="$GITHUB_REF_NAME" --build-arg COMMIT="$GITHUB_SHA" --build-arg BUILD_TIME='${{ steps.meta.outputs.built_at }}' -t lightd:smoke .
          docker run --rm --read-only --tmpfs /tmp lightd:smoke --version
          docker run --rm --read-only --tmpfs /tmp -v "$PWD/examples:/examples:ro" lightd:smoke --preview-policy /examples/seasonal-policy.lua --date 2026-12-21 --timezone UTC --latitude 0 --longitude 0 --json
      - name: Scan container for fixable high and critical vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$RUNNER_TEMP/trivy:/root/.cache/trivy" aquasec/trivy:0.76.1 image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 lightd:smoke
      - name: Publish image and provenance
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.built_at }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          provenance: mode=max
          sbom: true
  publish:
    needs: [binaries, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-*
          path: release
          merge-multiple: true
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf 'ghcr.io/%s@%s\n' "$GITHUB_REPOSITORY" "$IMAGE_DIGEST" > release/image-digest.txt
          (cd release && sha256sum lightd-* image-digest.txt > checksums.txt)
          python3 - <<'PY'
          import os,pathlib
          text=pathlib.Path('CHANGELOG.md').read_text()
          text+='\n\nContainer: `ghcr.io/'+os.environ['GITHUB_REPOSITORY']+'@'+os.environ['IMAGE_DIGEST']+'`\n'
          text+='\nSource: `'+os.environ['GITHUB_SHA']+'`\n'
          pathlib.Path('release-notes.md').write_text(text)
          PY
          gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md --repo "$GITHUB_REPOSITORY" release/*
